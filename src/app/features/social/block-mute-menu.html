<details class="menu" (toggle)="onToggle($event)">
  <summary [attr.aria-label]="'More actions for ' + username()">⋯</summary>
  <div class="items" role="menu" [attr.aria-label]="'Actions for ' + username()">
    <button type="button" role="menuitem" (click)="toggleMute()" [disabled]="state() === 'saving'">
      {{ mutedNow() ? 'Unmute' : 'Mute' }} @{{ username() }}
    </button>
    <button
      type="button"
      role="menuitem"
      class="danger"
      (click)="block()"
      [disabled]="state() === 'saving'"
    >
      Block @{{ username() }}
    </button>
    <button type="button" role="menuitem" (click)="openReport(reportDialog)">
      Report @{{ username() }}
    </button>
  </div>
</details>
<fc-report-dialog #reportDialog [target]="reportTarget()" />

@if (state() === 'confirmBlock') {
  <div
    class="confirm"
    role="alertdialog"
    aria-labelledby="block-confirm-h"
    aria-describedby="block-confirm-d"
  >
    <p id="block-confirm-h">
      <strong>Block @{{ username() }}?</strong>
    </p>
    <p id="block-confirm-d">You follow each other. You won't see each other's posts or messages.</p>
    <div class="confirm-actions">
      <button type="button" class="fc-secondary" (click)="cancelConfirm()">Cancel</button>
      <button type="button" class="fc-danger" (click)="confirmBlock()">Block</button>
    </div>
  </div>
}

@if (notice()) {
  <p class="notice" role="alert">{{ notice() }}</p>
}
