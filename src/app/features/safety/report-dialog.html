<dialog #dialog class="report" [attr.aria-label]="title()" (close)="chosen.set(null)">
  <h2>{{ title() }}</h2>
  <p class="sub">
    Your report is reviewed by a person. Misuse of reporting may affect your account.
  </p>

  @if (sent()) {
    <p role="status" class="sent">Thanks — we'll review this.</p>

    <!-- Dismissed explicitly rather than on a timer. The old 1.2s auto-close was
         reported as unreadable, and a confirmation that vanishes on its own is exactly
         what a screen reader user misses: focus stays on a node that no longer exists. -->
    <div class="actions">
      <button type="button" class="fc-primary" autofocus (click)="close()">Close</button>
    </div>
  } @else {
    <fc-auth-error [error]="error()" context="generic" />

    <div class="categories" role="radiogroup" aria-label="Report reason">
      @for (c of categories; track c.value) {
        <label>
          <input
            type="radio"
            name="report-category"
            [value]="c.value"
            [checked]="chosen() === c.value"
            (change)="chosen.set(c.value)"
          />
          {{ c.label }}
        </label>
      }
    </div>

    <label class="note-label" [attr.for]="noteId()">Details (optional)</label>
    <textarea
      [attr.id]="noteId()"
      rows="2"
      [ngModel]="note()"
      (ngModelChange)="note.set($event)"
      [ngModelOptions]="{ standalone: true }"
      placeholder="Anything that helps a moderator understand…"
    ></textarea>

    <div class="actions">
      <button type="button" class="fc-secondary" (click)="close()">Cancel</button>
      <button
        type="button"
        class="fc-primary"
        [disabled]="sending() || chosen() === null"
        (click)="submit()"
      >
        {{ sending() ? 'Sending…' : 'Send report' }}
      </button>
    </div>
  }
</dialog>
