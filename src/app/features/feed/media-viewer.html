<div class="viewer" [class.compact]="compact()">
  @if (revealedNow()) {
    <!-- A button, not a click handler on the img: an image that opens something must be
         reachable by keyboard, and this gets that for free. -->
    <button type="button" class="zoom" aria-label="View image at full size" (click)="open()">
      <img [src]="src()" alt="Attached image" loading="lazy" />
    </button>
  } @else {
    <!-- Shown because the server withheld the URLs, not because a local flag says so. -->
    <div class="placeholder" role="group" aria-label="Sensitive media warning">
      @if (revealFailed()) {
        <p class="title">Media unavailable</p>
        <p class="body">
          This image can't be shown to you. It may have been removed, or you may not have access.
        </p>
      } @else {
        <p class="title">Sensitive media</p>
        <p class="body">This media may contain flashing lights or intense motion.</p>
        <button type="button" [disabled]="revealing()" (click)="reveal()">
          {{ revealing() ? 'Loading…' : 'Show media' }}
        </button>
      }
    </div>
  }

  <!-- The dialog is gated on revealedNow() too, not just hidden. Rendering a hidden
       <img src> would still make the browser FETCH flagged media before consent, which
       is the one thing the placeholder exists to prevent. -->
  @if (revealedNow()) {
    <dialog #lightbox class="lightbox" aria-label="Image at full size" (click)="onBackdrop($event)">
      <img [src]="fullSrc()" alt="Attached image, full size" />
      <button type="button" class="close" aria-label="Close full-size view" (click)="close()">
        ✕
      </button>
    </dialog>
  }
</div>
