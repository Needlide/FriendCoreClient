<fc-auth-layout
  title="Welcome back"
  lede="Sign in to see the latest from people you follow."
  [hasFooter]="true"
>
  <fc-auth-error [error]="error()" context="login" />

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="fc-field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        autocomplete="email"
        formControlName="email"
        [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
        aria-describedby="login-email-error"
      />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <p class="field-error" id="login-email-error">Enter a valid email address.</p>
      }
    </div>

    <div class="fc-field">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
        [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        aria-describedby="login-password-error"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <p class="field-error" id="login-password-error">Enter your password.</p>
      }
    </div>

    <button class="fc-submit" type="submit" [disabled]="busy()">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <span slot="switch">No account yet? <a routerLink="/auth/register">Create one</a></span>
</fc-auth-layout>
