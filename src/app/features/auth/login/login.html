<fc-auth-layout
  heading="Welcome back"
  lede="Sign in to see the latest from people you follow."
  [hasFooter]="true"
>
  <fc-auth-error [error]="error()" context="login" />

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="req-note">All fields are required.</p>
    <div class="fc-field required">
      <label for="login-username">Username</label>
      <input
        id="login-username"
        type="text"
        required
        autocomplete="username"
        formControlName="username"
        [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched"
        aria-describedby="login-username-error"
      />
      @if (form.controls.username.invalid && form.controls.username.touched) {
        <p class="field-error" id="login-username-error">Enter your username.</p>
      }
    </div>

    <div class="fc-field required">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        required
        autocomplete="current-password"
        formControlName="password"
        [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        aria-describedby="login-password-error"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <p class="field-error" id="login-password-error">Enter your password.</p>
      }
    </div>

    <button class="fc-submit" type="submit" [disabled]="busy()">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="forgot"><a routerLink="/auth/forgot-password">Forgot your password?</a></p>
  <span slot="switch">No account yet? <a routerLink="/auth/register">Create one</a></span>
</fc-auth-layout>
