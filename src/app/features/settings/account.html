<div class="settings-page">
  <h1>Account</h1>

  @if (auth.session(); as s) {
    <section class="card" aria-label="Session">
      <p class="name">
        {{ s.displayName }} <span class="username">@{{ s.username }}</span>
      </p>
      @if (s.isEmailVerified) {
        <p class="ok" role="status">Email verified.</p>
      } @else {
        <p class="warn" role="alert">Email not verified — posting is disabled until you verify.</p>
        <div class="resend-row">
          <label class="fc-sr-only" for="account-resend-email">Email you signed up with</label>
          <input
            id="account-resend-email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            [value]="resendEmail()"
            (input)="resendEmail.set($any($event.target).value)"
            [disabled]="resending() || resent()"
          />
          <button
            type="button"
            class="fc-secondary"
            (click)="resend()"
            [disabled]="resending() || resent() || resendEmail().trim().length === 0"
          >
            {{
              resent() ? 'Email sent — check your inbox' : resending() ? 'Sending…' : 'Resend email'
            }}
          </button>
        </div>
      }
    </section>
  }

  <section class="card" aria-label="Sign out">
    <h2>Sign out</h2>
    <button type="button" class="fc-danger" [disabled]="busy()" (click)="logout()">
      {{ busy() ? 'Signing out…' : 'Log out' }}
    </button>
  </section>
</div>
