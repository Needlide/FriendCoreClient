<header class="topbar">
  <a class="brand" routerLink="/">FriendCore</a>
  <nav aria-label="Main">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      #homeRla="routerLinkActive"
      [attr.aria-current]="homeRla.isActive ? 'page' : null"
      >Home</a
    >
    <a
      routerLink="/discover"
      routerLinkActive="active"
      #discoverRla="routerLinkActive"
      [attr.aria-current]="discoverRla.isActive ? 'page' : null"
      >Discover</a
    >
    <a
      routerLink="/messages"
      routerLinkActive="active"
      #messagesRla="routerLinkActive"
      [attr.aria-current]="messagesRla.isActive ? 'page' : null"
      >Messages
      @if (unread.total() > 0) {
        <span class="nav-badge">
          <!-- sr-only, because a bare "3" next to a link is meaningless when read aloud. The
               visual number stays hidden from assistive tech so it is not announced twice. -->
          <span class="fc-sr-only">{{ unread.total() }} unread messages</span>
          <span aria-hidden="true">{{ unread.total() > 99 ? '99+' : unread.total() }}</span>
        </span>
      }
    </a>
  </nav>
  <div class="tools">
    <fc-notification-bell
      [unread]="notifications.unread()"
      [silencedUntil]="notifications.snoozedUntil()"
    />
    <details #menu class="avatar-menu">
      <summary [attr.aria-label]="'Account menu for ' + (myUsername() ?? 'you')">
        {{ (myUsername() ?? '?')[0]?.toUpperCase() }}
      </summary>
      <div class="items" role="menu" aria-label="Account">
        <a role="menuitem" [routerLink]="['/u', myUsername()]" (click)="menu.open = false"
          >Profile</a
        >
        <a role="menuitem" routerLink="/settings" (click)="menu.open = false">Settings</a>
        <a role="menuitem" routerLink="/help" (click)="menu.open = false">Help &amp; support</a>
        <button role="menuitem" type="button" (click)="menu.open = false; logout()">Log out</button>
      </div>
    </details>
  </div>
</header>
<main id="main-content">
  <router-outlet />
</main>

<footer class="site-footer">
  <!-- FreeDNS (freedns.afraid.org) provides the subdomain's DNS and asks for a text link in
       return. A footer rather than a dedicated page: it is present on every page without costing
       the user a navigation, and it stays out of the way of the conversation itself. -->
  <span>DNS by </span><a href="https://freedns.afraid.org/" rel="noopener">Free DNS</a>
</footer>
